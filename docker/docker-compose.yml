# Chat2DB Community - Persian web edition
#
#   cd <repository root>
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Then open http://127.0.0.1:10825
#
# Nothing needs to exist on the host beforehand: the image is built from this
# repository and the encryption key is generated into the data volume on first
# start.
#
# Settings go in `docker/.env`, next to this file - see docker/.env.example.
# That is the project directory for the command above, so a `.env` in the
# repository root is ignored without a word. `docker compose -f
# docker/docker-compose.yml config` prints what actually reached the container.
#
# SECURITY: the default binding is 127.0.0.1, so the service is reachable only
# from the machine it runs on, and named accounts guard the whole API. An
# `admin` account is created on first start and its password printed in the
# container log; set CHAT2DB_COMMUNITY_PASSWORD to choose your own, or
# CHAT2DB_DISABLE_LOGIN=true to turn the gate off.
#
# Each account owns a workspace: its connections, consoles, history and settings
# are its own, and an admin sees no more of them than anyone else. What an
# account is not is a database permission - a connection carries the database's
# own credentials, and whoever holds it can do whatever those allow.
#
# There is still no TLS here, so the sign-in password crosses the wire in the
# clear. Over anything but loopback, put it behind a reverse proxy that
# terminates TLS, or restrict it to a private network / VPN.

services:
  chat2db:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # The repository pins registry.npmmirror.com. Override it when that
        # mirror is unreachable from your build network - either by setting
        # CHAT2DB_NPM_REGISTRY in .env or by editing the default below.
        # Known-good values:
        #   https://registry.npmjs.org/        (official)
        #   https://mirror-npm.runflare.com/   (Iran)
        # A missing trailing slash is added automatically.
        NPM_REGISTRY: ${CHAT2DB_NPM_REGISTRY:-}
        APP_VERSION: ${CHAT2DB_APP_VERSION:-5.3.0}
    image: chat2db-fa:${CHAT2DB_IMAGE_TAG:-latest}
    container_name: chat2db-community
    restart: unless-stopped
    ports:
      - "${CHAT2DB_BIND_ADDRESS:-127.0.0.1}:${CHAT2DB_PORT:-10825}:10825"
    # List form throughout: an entry with no "=" passes the variable through only
    # when it is actually set on the host. The mapping form `KEY: ${KEY:-}` would
    # instead define it as an empty string, and the server treats an empty value
    # as a real (and invalid) key rather than as "not configured".
    environment:
      - JAVA_OPTS=${CHAT2DB_JAVA_OPTS:--Xmx2g}
      # Set this to pin your own key; otherwise one is generated at
      # /root/.chat2db-community/config/encryption.key inside the volume below.
      - CHAT2DB_COMMUNITY_ENCRYPTION_KEY
      # Shared password for the sign-in screen. Unset means one is generated on
      # first start and printed in the log; see docker/entrypoint.sh.
      - CHAT2DB_COMMUNITY_PASSWORD
      # Set to true to remove the sign-in screen entirely.
      - CHAT2DB_DISABLE_LOGIN
      # Extra browser origins to trust, comma separated. Needed only when a
      # reverse proxy hides the address the browser actually used.
      - CHAT2DB_COMMUNITY_ALLOWED_ORIGINS
      # Set to true to build every subsystem during startup instead of on first
      # use. Slightly faster first page, slower and riskier start.
      - CHAT2DB_EAGER_INIT
    volumes:
      # Holds saved connections, query history and the encryption key.
      - chat2db-community-data:/root/.chat2db-community
    healthcheck:
      # /dev/tcp is a bash builtin; the image's /bin/sh is dash, so call bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10825"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous, because CHAT2DB_EAGER_INIT=true (see docker/entrypoint.sh)
      # moves subsystem warm-up into startup and delays the port opening.
      start_period: 180s

volumes:
  chat2db-community-data:
